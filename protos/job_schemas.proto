    enum Endian {
      // Use little endian byte order.
      LITTLE_ENDIAN = 0;
      // Use big endian byte order.
      BIG_ENDIAN = 1;
    }
    /// The endianness of the stored value.
    optional Endian endian = 2;
    enum BufferParseType {
      /// A public key.
