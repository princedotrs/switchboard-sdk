[package]
name = "switchboard-protos"
version = "0.2.7"
edition = "2021"
description = "Protobuf definitions for Switchboard oracle job schemas"
license = "MIT"
repository = "https://github.com/switchboard-xyz/switchboard-sdk"

[dependencies]
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pbjson = "0.7"

[build-dependencies]
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[features]
serde = []
